<!-- Sidebar visitor counter (GoatCounter: today / total) -->
{% if site.analytics.goatcounter.id %}
<script defer>
  document.addEventListener('DOMContentLoaded', function () {
    var nav = document.querySelector('#sidebar nav');
    if (!nav) return;

    var box = document.createElement('div');
    box.id = 'visitor-counter';
    box.innerHTML =
      '<div class="vc-item"><span class="vc-label">TODAY</span><span class="vc-num" data-vc="today">-</span></div>' +
      '<i class="fas fa-mug-hot fa-fw"></i>' +
      '<div class="vc-item"><span class="vc-label">TOTAL</span><span class="vc-num" data-vc="total">-</span></div>';
    nav.insertAdjacentElement('afterend', box);

    var base = 'https://{{ site.analytics.goatcounter.id }}.goatcounter.com/counter/TOTAL.json';
    /* today's date in KST (yyyy-mm-dd); no // comments: compress_html joins lines */
    var today = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul' }).format(new Date());

    function fill(key, url) {
      var el = box.querySelector('[data-vc="' + key + '"]');
      fetch(url)
        .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
        .then(function (d) {
          var n = String(d.count).replace(/[^\d]/g, '') || '0';
          el.textContent = n.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        })
        .catch(function () { el.textContent = '0'; });
    }

    fill('today', base + '?start=' + today);
    fill('total', base);
  });
</script>
{% endif %}
