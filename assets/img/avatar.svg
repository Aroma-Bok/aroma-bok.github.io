<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe3ec"/>
      <stop offset="1" stop-color="#ffd6a8"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3ece6"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- sparkles -->
  <g fill="#ffffff" opacity="0.9">
    <path d="M40 52 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
    <path d="M158 60 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/>
    <circle cx="150" cy="38" r="3"/>
  </g>

  <!-- steam -->
  <g fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.95">
    <path d="M84 62 q-8 -10 0 -20 q8 -10 0 -20"/>
    <path d="M104 58 q-8 -10 0 -20 q8 -10 0 -20"/>
    <path d="M124 62 q-8 -10 0 -20 q8 -10 0 -20"/>
  </g>

  <!-- saucer shadow -->
  <ellipse cx="100" cy="168" rx="62" ry="9" fill="#e8a98c" opacity="0.45"/>

  <!-- handle -->
  <path d="M142 98 q30 0 28 24 q-2 22 -32 20" fill="none" stroke="#f3ece6" stroke-width="12" stroke-linecap="round"/>
  <path d="M142 98 q30 0 28 24 q-2 22 -32 20" fill="none" stroke="#6b4a3a" stroke-width="3" stroke-linecap="round" opacity="0.25"/>

  <!-- cup body -->
  <path d="M50 80 h100 v52 q0 30 -30 30 h-40 q-30 0 -30 -30z" fill="url(#cup)" stroke="#6b4a3a" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- coffee top -->
  <ellipse cx="100" cy="80" rx="50" ry="10" fill="#8a5a3c" stroke="#6b4a3a" stroke-width="3.5"/>
  <ellipse cx="88" cy="78" rx="14" ry="3" fill="#b07a55" opacity="0.8"/>

  <!-- face -->
  <ellipse cx="80" cy="118" rx="6" ry="7.5" fill="#3b2a22"/>
  <ellipse cx="120" cy="118" rx="6" ry="7.5" fill="#3b2a22"/>
  <circle cx="82" cy="115" r="2.2" fill="#ffffff"/>
  <circle cx="122" cy="115" r="2.2" fill="#ffffff"/>
  <path d="M93 128 q7 7 14 0" fill="none" stroke="#3b2a22" stroke-width="3.5" stroke-linecap="round"/>
  <ellipse cx="68" cy="132" rx="9" ry="5.5" fill="#ff9fb2" opacity="0.75"/>
  <ellipse cx="132" cy="132" rx="9" ry="5.5" fill="#ff9fb2" opacity="0.75"/>

  <!-- code tag -->
  <text x="100" y="153" text-anchor="middle"
        font-family="Consolas, 'Courier New', monospace"
        font-size="13" font-weight="700" fill="#c98a6a">&lt;/&gt;</text>
</svg>
