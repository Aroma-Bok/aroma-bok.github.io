<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a3528"/>
      <stop offset="1" stop-color="#2b211c"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7efe4"/>
      <stop offset="1" stop-color="#e6d8c6"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- steam -->
  <g fill="none" stroke="#e0a24a" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <path d="M86 60 q-7 -9 0 -18 q7 -9 0 -18"/>
    <path d="M104 56 q-7 -9 0 -18 q7 -9 0 -18"/>
    <path d="M122 60 q-7 -9 0 -18 q7 -9 0 -18"/>
  </g>

  <!-- saucer shadow -->
  <ellipse cx="100" cy="168" rx="60" ry="8" fill="#000000" opacity="0.3"/>

  <!-- handle -->
  <path d="M142 98 q30 0 28 24 q-2 22 -32 20" fill="none" stroke="#e6d8c6" stroke-width="12" stroke-linecap="round"/>

  <!-- cup body -->
  <path d="M50 80 h100 v52 q0 30 -30 30 h-40 q-30 0 -30 -30z" fill="url(#cup)" stroke="#1e1612" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- coffee top -->
  <ellipse cx="100" cy="80" rx="50" ry="10" fill="#5a3a26" stroke="#1e1612" stroke-width="3.5"/>
  <ellipse cx="88" cy="78" rx="14" ry="3" fill="#8a5a3c" opacity="0.8"/>

  <!-- face -->
  <ellipse cx="82" cy="118" rx="5" ry="6.5" fill="#2b211c"/>
  <ellipse cx="118" cy="118" rx="5" ry="6.5" fill="#2b211c"/>
  <circle cx="83.5" cy="115.5" r="1.6" fill="#ffffff"/>
  <circle cx="119.5" cy="115.5" r="1.6" fill="#ffffff"/>
  <path d="M94 129 q6 5 12 0" fill="none" stroke="#2b211c" stroke-width="3.2" stroke-linecap="round"/>

  <!-- code tag -->
  <text x="100" y="153" text-anchor="middle"
        font-family="Consolas, 'Courier New', monospace"
        font-size="13" font-weight="700" fill="#c27a22">&lt;/&gt;</text>
</svg>
